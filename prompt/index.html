<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Prompt</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="./index-xXr5Jin1.css">
    <style>
        body {
            margin: 0;
        }

        #password-gate {
            align-items: center;
            background: #f7f7f5;
            color: #111111;
            display: flex;
            font-family: Arial, sans-serif;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        #password-form {
            display: grid;
            gap: 16px;
            max-width: 360px;
            width: 100%;
        }

        #password-form h1,
        #password-form p {
            margin: 0;
        }

        #password-form h1 {
            font-size: 28px;
        }

        #password-input,
        #password-form button {
            border: 1px solid #111111;
            border-radius: 0;
            font: inherit;
            padding: 12px;
        }

        #password-form button {
            background: #111111;
            color: #ffffff;
            cursor: pointer;
        }

        #password-error {
            color: #b42318;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <main id="password-gate">
        <form id="password-form">
            <p>VIDEO PROMPT</p>
            <h1>Enter password</h1>
            <p>This page is password protected.</p>
            <input id="password-input" type="password" autocomplete="current-password" aria-label="Password" required>
            <p id="password-error" aria-live="polite"></p>
            <button type="submit">Continue</button>
        </form>
    </main>
    <div id="root" hidden></div>
    <script>
        const accessKey = 'prompt-access-granted';
        const password = 'asd123';
        const gate = document.getElementById('password-gate');
        const root = document.getElementById('root');
        const form = document.getElementById('password-form');
        const input = document.getElementById('password-input');
        const error = document.getElementById('password-error');

        function loadPromptCatalog() {
            gate.hidden = true;
            root.hidden = false;
            const script = document.createElement('script');
            script.type = 'module';
            script.src = './index-Djrmgv45.js';
            document.body.appendChild(script);
        }

        if (sessionStorage.getItem(accessKey) === 'true') {
            loadPromptCatalog();
        } else {
            input.focus();
            form.addEventListener('submit', (event) => {
                event.preventDefault();
                if (input.value === password) {
                    sessionStorage.setItem(accessKey, 'true');
                    loadPromptCatalog();
                    return;
                }
                error.textContent = 'Incorrect password.';
                input.select();
            });
        }
    </script>
</body>
</html>
